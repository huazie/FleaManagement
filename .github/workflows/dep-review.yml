name: Dependency Review

on:
  pull_request:
    # 纯文档/SQL/静态资源变更不涉及依赖,跳过审查
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.svg'
      - 'sql/**'
      - 'src/docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
