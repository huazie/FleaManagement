name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FleaManagement
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # flea-framework 2.0.0 尚未发布到 Maven Central,先从 dev 分支安装到本地仓库
      - name: Install Flea Framework (dev branch)
        run: |
          git clone --depth 1 --branch dev https://github.com/huazie/flea-framework.git
          mvn -B -f flea-framework/pom.xml install -DskipTests -Dmaven.javadoc.skip=true

      - name: Build FleaManagement
        run: mvn -B package -DskipTests

      - name: Upload war to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fleamgmt-web/target/*.war
          generate_release_notes: true
