		<!-- inline styles related to this page -->
		<style>
		/* 穿梭框工具条 */
		.shuttle-toolbar {
			margin-bottom: 8px;
		}

		.shuttle-toolbar .shuttle-search {
			display: inline-block;
			width: 55%;
			vertical-align: middle;
		}

		.shuttle-toolbar .btn-group {
			vertical-align: middle;
			margin-left: 6px;
		}

		.shuttle-panel-title {
			font-weight: bold;
			margin-bottom: 6px;
			color: #478fca;
		}

		/* 候选数据列表 */
		.shuttle-list {
			height: 260px;
			overflow-y: auto;
			border: 1px solid #e5e5e5;
			border-radius: 3px;
			padding: 4px 8px;
		}

		.shuttle-item {
			display: block;
			font-weight: normal;
			margin: 0;
			padding: 4px 2px;
			border-bottom: 1px dashed #eee;
			cursor: pointer;
		}

		.shuttle-item:last-child {
			border-bottom: none;
		}

		.shuttle-item:hover {
			background-color: #f5f8fa;
		}

		.shuttle-item .lbl {
			margin-left: 4px;
		}

		/* 授权清单 */
		.selected-list {
			min-height: 34px;
			line-height: 26px;
			padding: 4px;
			border: 1px dashed #d5d5d5;
			border-radius: 3px;
		}

		.selected-list .label {
			margin-right: 4px;
			display: inline-block;
		}

		.shuttle-remove {
			cursor: pointer;
		}

		/* 标签页 */
		#auth_tabs .nav-tabs {
			margin-bottom: 0;
		}

		#auth_tabs .tab-content {
			padding: 14px;
			border: 1px solid #ddd;
			border-top: none;
			border-radius: 0 0 4px 4px;
			background-color: #fff;
		}
		/* ==================== 窄屏适配（<768px，与 Bootstrap xs 同断点） ==================== */
		/* 表格搜索框桌面端不显示，仅小屏承担筛选职责 */
		.grid-mobile-search {
			display: none;
		}

		@media only screen and (max-width: 767px) {

			/* 兜底：组件内部（分页栏）已自带横滑，整页不应再出现横向滚动条 */
			body {
				overflow-x: hidden;
			}

			/* 顶层栅格行的负外边距在小屏会左右各顶出 3px（实测 .row 宽 381 > 视口 375），清零消除整页横滑 */
			.page-content > .row {
				margin-left: 0;
				margin-right: 0;
			}

			/* 页头：主标题收紧，面包屑与「收藏」文字收起，避免换行 */
			.page-header h1 {
				font-size: 16px;
			}

			.page-header h1 small {
				display: none;
			}

			.page-header-fav span {
				display: none;
			}

			/* 卡片头：右侧提示文字在小屏会把标题挤掉，隐藏 */
			.widget-header .widget-toolbar > small {
				display: none;
			}

			/* 统计卡：小屏三卡并排，去掉大图标，仅留数值与标签 */
			.stat-card {
				padding: 8px 4px;
				text-align: center;
			}

			.stat-card .stat-icon {
				display: none;
			}

			.stat-card .pull-right {
				float: none !important;
			}

			.stat-card .stat-value {
				font-size: 18px;
			}

			.stat-card .stat-label {
				font-size: 11px;
			}

			/* 表格搜索框：小屏出现 */
			.grid-mobile-search {
				display: block;
				margin-bottom: 6px;
			}

			/* jqGrid 筛选行：小屏控件仅 26px 宽，无法输入，整体隐藏 */
			.ui-jqgrid .ui-search-toolbar {
				display: none;
			}

			/* jqGrid 分页栏：内容天然宽于容器，改为就地横滑，避免撑破页面 */
			.ui-jqgrid .ui-jqgrid-pager {
				height: auto !important;
				overflow-x: auto;
				overflow-y: hidden;
				-webkit-overflow-scrolling: touch;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table {
				width: auto !important;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table td {
				white-space: nowrap;
			}

			/* 每页条数选择器小屏无意义，且是撑宽分页栏的主因之一 */
			.ui-jqgrid .ui-jqgrid-pager .ui-pg-selbox {
				display: none;
			}

			/* 分页栏左右两侧（刷新/每页条数、记录数）在小屏会把总宽撑到容器外，
			   收起后只留中间的分页导航，消除组件内的横向滚动条 */
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_left"],
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_right"] {
				display: none;
			}

			/* 表格本体：字号与内边距收紧，小屏一屏多看两行 */
			.ui-jqgrid {
				font-size: 12px;
			}

			.ui-jqgrid .ui-jqgrid-htable th,
			.ui-jqgrid tr.jqgrow td {
				/* 手指点选需要更大的行高，同时兼顾一屏可见行数 */
				padding: 5px 2px;
			}

			/* 穿梭框：搜索框独占一行，列表矮一截，底部按钮整行 */
			.shuttle-toolbar .shuttle-search {
				display: block;
				width: 100%;
				margin-bottom: 6px;
			}

			.shuttle-toolbar .btn-group {
				margin-left: 0;
			}

			.shuttle-list {
				height: 190px;
			}

			/* 候选/清单条目加高，便于手指点选 */
			.shuttle-item {
				padding: 8px 4px;
			}

			.shuttle-actions .btn {
				display: block;
				width: 100%;
				margin: 0 0 6px 0;
			}

			/* 表单底部按钮：小屏留出换行间距 */
			.wizard-actions .btn {
				margin-bottom: 6px;
			}
		}

		</style>
