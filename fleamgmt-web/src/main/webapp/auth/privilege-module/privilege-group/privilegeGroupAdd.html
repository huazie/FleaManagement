		<style>
			/* 候选授权项列表 */
			.candidate-list {
				max-height: 300px;
				overflow-y: auto;
				border: 1px solid #e5e5e5;
				border-radius: 3px;
				padding: 4px 6px;
			}

			.candidate-item {
				display: block;

				padding: 4px 2px;
				border-bottom: 1px dashed #eee;
				cursor: pointer;
			}

			.candidate-item:last-child {
				border-bottom: none;
			}

			.candidate-item:hover {
				background-color: #f5f8fa;
			}

			.candidate-item .lbl {
				margin-left: 4px;
			}

			/* 已选清单 */
			.selected-list {
				min-height: 32px;

				border-radius: 3px;
			}

			.selected-list .label {
				margin-right: 4px;
				display: inline-block;
			}

	<body>
		<div class="page-content">
			<div class="page-header">
				<h1>
					权限模块管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						&nbsp;权限组管理
					</small>
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;权限组新增
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->
			
			<div class="row">
				<div class="col-xs-12">


					<div class="col-sm-3">

						<div class="alert alert-block alert-success">
							<button type="button" class="close" data-dismiss="alert">
								<i class="fa fa-remove"></i>
							</button>

							<i class="fa fa-hand-o-right blue"></i>
							亲，请在右侧表单中新增权限组哟！<br/><strong class="red"><i class="fa fa-info-circle"></i> 提示 :</strong>【同一功能类型下框架只认一个主权限组】
						</div>

						<div class="widget-box">
							<div class="widget-header header-color-blue2">
								<h5 class="lighter smaller">
									<i class="fa fa-list-alt fa-lg"></i>
									权限组列表
								</h5>
							</div>

							<div class="widget-body">
								<div class="widget-main padding-8">
									<div id="tree_privilegeGroupAdd" class="tree"></div>
								</div>
							</div>
						</div>
					</div>
					
					<div class="col-sm-9">
						<div class="widget-box">
							<div class="widget-header">
								<h5 class="lighter smaller">
									<i class="fa fa-plus-circle fa-lg"></i>
									权限组新增
								</h5>
							
								<span class="widget-toolbar">
									<a href="#" data-action="collapse">
										<i class="fa fa-chevron-up"></i>
									</a>
								</span>
							</div>
							
							<div class="widget-body">
								<div id="privilege_group_add" class="widget-main" fieldset="json">
								<div class="form-group">
									<label for="privilegeGroupName">
										<i class="fa fa-hand-o-right blue"></i>
										<span class="blue">权限组名称</span> <span class="red">*</span>
									</label>

									<input class="form-control" type="text" id="privilegeGroupName" name="privilegeGroupName" placeholder="权限组显示名称" />
								</div>

								<div class="space-2"></div>

								<div class="form-group">
									<label for="privilegeGroupDesc">
										<i class="fa fa-hand-o-right blue"></i>
										<span class="blue">权限组描述</span>
									</label>

									<textarea class="autosize-transition form-control" id="privilegeGroupDesc" name="privilegeGroupDesc" placeholder="填写该权限组对应的业务含义"></textarea>
								</div>

								<div class="space-2"></div>

								<div class="form-group">
									<label for="isMain">
										<i class="fa fa-hand-o-right blue"></i>
										<span class="blue">是否主权限组</span>
									</label>

									<select class="form-control" id="isMain" name="isMain">
										<option value="0">非主权限组</option>
										<option value="1">主权限组</option>
									</select>
								</div>

								<div class="space-2"></div>

								<div class="form-group">
									<label for="functionType">
										<i class="fa fa-hand-o-right blue"></i>
										<span class="blue">功能类型</span>
									</label>

									<select class="form-control" id="functionType" name="functionType">
										<option value="MENU">菜单</option>
										<option value="OPERATION">操作</option>
										<option value="ELEMENT">元素</option>
										<option value="RESOURCE">资源</option>
									</select>
								</div>

								<div class="space-2"></div>

								<div class="form-group">
									<label for="remarks">
										<i class="fa fa-hand-o-right blue"></i>
										<span class="blue">备注</span>
									</label>

									<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写权限组相关的描述信息，留存备注"></textarea>
								</div>

								<div class="space-2"></div>

									<div class="row-fluid wizard-actions">
										<button id="submit" class="btn btn-info" type="button">
											<i class="fa fa-check bigger-110"></i>
											提交
										</button>
										<button id="reset" class="btn btn-inverse" type="button">
											<i class="fa fa-undo bigger-110"></i>
											重置
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
					<i class="fa fa-angle-double-up icon-only bigger-110"></i>
				</a>
			</div>	
		</div>
