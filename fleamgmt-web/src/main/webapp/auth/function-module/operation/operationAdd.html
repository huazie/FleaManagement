<!DOCTYPE html>
<html>
	<head>
		<title>操作新增</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- 基础样式 basic styles -->
		<link rel="stylesheet" href="../resources/plugins/bootstrap/css/bootstrap.min.css"  />
		<link rel="stylesheet" href="../resources/plugins/font-awesome/css/font-awesome.css" />

		<!-- page specific plugin styles -->

		<link rel="stylesheet" href="../resources/plugins/dialog/6.0.4/css/ui-dialog.css" />

		<!-- ace styles -->
		<link rel="stylesheet" href="../resources/plugins/ace/css/ace.css" />

		<link rel="stylesheet" href="../resources/plugins/ace/css/ace-skins.css" />

		<link rel="stylesheet" href="../resources/plugins/ace/css/ace-ie.css"/>
		<![endif]-->

		<!-- inline styles related to this page -->

		<!-- ace settings handler -->
		<script src="../resources/plugins/ace/js/ace-extra.js"></script>

		<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
		<!--[if lt IE 9]>
		<script src="../resources/plugins/html5shiv/html5shiv.js"></script>
		<script src="../resources/plugins/respond/respond.min.js"></script>
		<![endif]-->

	<body>
		<div class="page-content">
			<div class="page-header">
				<h1>
					操作管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;操作新增
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->
			
			<div class="row">
				<div class="col-xs-12">

					<div class="col-sm-3">

						<div class="alert alert-block alert-success">
							<button type="button" class="close" data-dismiss="alert">
								<i class="fa fa-remove"></i>
							</button>

							<i class="fa fa-hand-o-right blue"></i>
							亲，请在右侧表单中新增操作哟！<br/>
							<strong class="red">
								<i class="fa fa-info-circle"></i> 提示 :
							</strong>
							【如需变更已有操作，请使用「操作变更」菜单】
						</div>

						<div class="widget-box">
							<div class="widget-header header-color-blue2">
								<h5 class="lighter smaller">
									<i class="fa fa-list-alt fa-lg"></i>
									操作列表
								</h5>
							</div>

							<div class="widget-body">
								<div class="widget-main padding-8">
									<div id="tree_add" class="tree"></div>
								</div>
							</div>
						</div>
					</div>
					
					<div class="col-sm-9">
						<div class="widget-box">
							<div class="widget-header">
								<h5 class="lighter smaller">
									<i class="fa fa-plus-circle fa-lg"></i>
									新增
								</h5>
							
								<span class="widget-toolbar">
									<a href="#" data-action="collapse">
										<i class="fa fa-chevron-up"></i>
									</a>
								</span>
							</div>
							
							<div class="widget-body">
								<div id="operation_add" class="widget-main" fieldset="json">

									<div class="form-group">
										<label for="operation_code">
											<i class="fa fa-hand-o-right blue"></i>
											<span class="blue">操作编码</span>
										</label>
								
										<input class="form-control" type="text" id="operation_code" name="operationCode" placeholder="比如文件上传,操作编码可以为'UPLOAD'" />
									</div>
									
									<div class="space-2"></div>
									
									<div class="form-group">
										<label for="operation_name">
											<i class="fa fa-hand-o-right blue"></i>
											<span class="blue">操作名称</span>
										</label>
								
										<input class="form-control" type="text" id="operation_name" name="operationName" placeholder="操作显示在前台的名称描述" />
									</div>
									
									<div class="space-2"></div>

									<div class="form-group">
										<label for="operation_desc">
											<i class="fa fa-hand-o-right blue"></i>
											<span class="blue">操作描述</span>
										</label>
								
										<textarea class="autosize-transition form-control" id="operation_desc" name="operationDesc" placeholder="填写该操作对应的业务含义"></textarea>
									</div>
									
									<div class="space-2"></div>

									<div class="form-group">
										<label for="remarks">
											<i class="fa fa-hand-o-right blue"></i>
											<span class="blue">备注</span>
										</label>
								
										<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写操作相关的描述信息，留存备注"></textarea>
									</div>
									
									<div class="space-2"></div>
									
									<div class="row-fluid wizard-actions">
										<button id="submit" class="btn btn-info" type="button">
											<i class="fa fa-check bigger-110"></i>
											提交
										</button>
										<button id="reset" class="btn btn-inverse" type="button">
											<i class="fa fa-undo bigger-110"></i>
											重置
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
					<i class="fa fa-angle-double-up icon-only bigger-110"></i>
				</a>
			</div>	
		</div>
		
		<!-- 基础脚本basic scripts -->
		
		<!--[if !IE]> -->
		<script src="../resources/plugins/jquery/2.0.3/jquery-2.0.3.min.js"></script>
		<!-- <![endif]-->
		
		<!--[if IE]>
		<script src="..\resources\plugins\jquery\1.10.2\jquery-1.10.2.min.js"></script>
		<![endif]-->

			window.jQuery || document.write("<script src='../resources/plugins/jquery/2.0.3/jquery-2.0.3.min.js'>"+"<"+"/script>");

		<script type="text/javascript">
			if("ontouchend" in document) document.write("<script src='../resources/plugins/jquery/mobile/jquery.mobile.custom.min.js'>"+"<"+"/script>");
		</script>
		<script src="../resources/plugins/bootstrap/js/bootstrap.min.js"></script>
		<script src="../resources/plugins/bootstrap/js/typeahead-bs2.min.js"></script>

		<!-- page specific plugin scripts -->
		<script src="../resources/plugins/jquery/ui/js/jquery-ui-1.10.3.custom.min.js"></script>
		<script src="../resources/plugins/jquery/ui/js/jquery.ui.touch-punch.min.js"></script>
		<script src="../resources/plugins/jquery/ui/js/jquery-ui-1.10.3.full.min.js"></script>
		<script src="../resources/plugins/fuelux/fuelux.tree.js"></script>
		<script src="../resources/plugins/handlebars/1.0.6/handlebars.js" ></script>
		<script src="../resources/plugins/handlebars/1.0.6/helpers.js" ></script>
		<script src="../resources/plugins/dialog/6.0.4/js/dialog-min.js" ></script>
		<script src="../resources/plugins/dialog/6.0.4/js/dialog-plus-min.js" ></script>
		<script src="../resources/scripts/base/config.js"></script>
		<script src="../resources/plugins/huazie/1.0.0/huazie.src.js"></script>
		<script src="../resources/plugins/seajs/2.3.0/sea.js" ></script>
		<script src="../resources/scripts/base/comm.js"></script>
		<script src="../resources/scripts/common/click.js"></script>
		
		<!-- ace scripts -->
		<script src="../resources/plugins/ace/js/ace-elements.js"></script>
		<script src="../resources/plugins/ace/js/ace.js"></script>

		<!-- inline scripts related to this page -->

			$(function(){
				
				// ### start load auth-operation.js
				seajs.use(SeaJsUrlMap.get("authOperation"), function(authOperation) {
					authOperation.init("add");
				}); // ### end load auth-operation.js
				
			});
		
		</script>

	</body>
</html>
