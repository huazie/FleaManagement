		<style>

		/* ==================== 窄屏适配（<768px，与 Bootstrap xs 同断点） ==================== */
		/* 表格搜索框桌面端不显示，仅小屏承担筛选职责 */
		.grid-mobile-search {
			display: none;
		}

		@media only screen and (max-width: 767px) {

			/* 兜底：组件内部（分页栏）已自带横滑，整页不应再出现横向滚动条 */
			body {
				overflow-x: hidden;
			}

			/* 顶层栅格行的负外边距在小屏会左右各顶出 3px（实测 .row 宽 381 > 视口 375），清零消除整页横滑 */
			.page-content > .row {
				margin-left: 0;
				margin-right: 0;
			}

			/* 页头：主标题收紧，面包屑与「收藏」文字收起，避免换行 */
			.page-header h1 {
				font-size: 16px;
			}

			.page-header h1 small {
				display: none;
			}

			.page-header-fav span {
				display: none;
			}

			/* 卡片头：右侧提示文字在小屏会把标题挤掉，隐藏 */
			.widget-header .widget-toolbar > small {
				display: none;
			}

			/* 统计卡：小屏三卡并排，去掉大图标，仅留数值与标签 */
			.stat-card {
				padding: 8px 4px;
				text-align: center;
			}

			.stat-card .stat-icon {
				display: none;
			}

			.stat-card .pull-right {
				float: none !important;
			}

			.stat-card .stat-value {
				font-size: 18px;
			}

			.stat-card .stat-label {
				font-size: 11px;
			}

			/* 表格搜索框：小屏出现 */
			.grid-mobile-search {
				display: block;
				margin-bottom: 6px;
			}

			/* jqGrid 筛选行：小屏控件仅 26px 宽，无法输入，整体隐藏 */
			.ui-jqgrid .ui-search-toolbar {
				display: none;
			}

			/* jqGrid 分页栏：内容天然宽于容器，改为就地横滑，避免撑破页面 */
			.ui-jqgrid .ui-jqgrid-pager {
				height: auto !important;
				overflow-x: auto;
				overflow-y: hidden;
				-webkit-overflow-scrolling: touch;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table {
				width: auto !important;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table td {
				white-space: nowrap;
			}

			/* 每页条数选择器小屏无意义，且是撑宽分页栏的主因之一 */
			.ui-jqgrid .ui-jqgrid-pager .ui-pg-selbox {
				display: none;
			}

			/* 分页栏左右两侧（刷新/每页条数、记录数）在小屏会把总宽撑到容器外，
			   收起后只留中间的分页导航，消除组件内的横向滚动条 */
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_left"],
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_right"] {
				display: none;
			}

			/* 表格本体：字号与内边距收紧，小屏一屏多看两行 */
			.ui-jqgrid {
				font-size: 12px;
			}

			.ui-jqgrid .ui-jqgrid-htable th,
			.ui-jqgrid tr.jqgrow td {
				/* 手指点选需要更大的行高，同时兼顾一屏可见行数 */
				padding: 5px 2px;
			}

			/* 穿梭框：搜索框独占一行，列表矮一截，底部按钮整行 */
			.shuttle-toolbar .shuttle-search {
				display: block;
				width: 100%;
				margin-bottom: 6px;
			}

			.shuttle-toolbar .btn-group {
				margin-left: 0;
			}

			.shuttle-list {
				height: 190px;
			}

			/* 候选/清单条目加高，便于手指点选 */
			.shuttle-item {
				padding: 8px 4px;
			}

			.shuttle-actions .btn {
				display: block;
				width: 100%;
				margin: 0 0 6px 0;
			}

			/* 表单底部按钮：小屏留出换行间距 */
			.wizard-actions .btn {
				margin-bottom: 6px;
			}
		}

		</style>

		<div class="page-content">
			<div class="page-header">
				<h1>
					功能模块管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						&nbsp;元素管理
					</small>
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;元素新增
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->

			<div class="row">
				<div class="col-xs-12">
					<div class="widget-box">
						<div class="widget-header widget-header-blue widget-header-flat">
							<h4 class="lighter">
								<i class="fa puzzle-piece fa-lg"></i>
								元素新增
							</h4>

							<div class="widget-toolbar">
								<span class="label label-info arrowed-right arrowed-in">两步完成</span>
							</div>
						</div>

						<div class="widget-body">
							<div id="auth_wizard_form" class="widget-main" fieldset="json">
								<div id="element_add_wizard" class="row-fluid" data-target="#element_add_steps">
									<ul class="wizard-steps">
										<li data-target="#element_add_steps_step1" class="active">
											<span class="step">1</span>
											<span class="title">元素信息</span>
										</li>

										<li data-target="#element_add_steps_step2">
											<span class="step">2</span>
											<span class="title">内容与确认</span>
										</li>
									</ul>
								</div>

								<hr />

								<div class="step-content row-fluid position-relative" id="element_add_steps">
									<div class="step-pane active" id="element_add_steps_step1">
										<h4 class="lighter blue">第 1 步 · 元素信息</h4>

										<div class="row">
										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementCode">
													<span class="blue">元素编码</span> <span class="red">*</span>
												</label>

											<input class="form-control" type="text" id="elementCode" name="elementCode" placeholder="全局唯一，如：btn-submit" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementName">
													<span class="blue">元素名称</span> <span class="red">*</span>
												</label>

											<input class="form-control" type="text" id="elementName" name="elementName" placeholder="如：提交按钮" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementType">
													<span class="blue">元素类型</span>
												</label>

											<input class="form-control" type="number" id="elementType" name="elementType" placeholder="元素类型（数值，如 1、2）" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementDesc">
													<span class="blue">元素描述</span>
												</label>

											<input class="form-control" type="text" id="elementDesc" name="elementDesc" placeholder="简要说明该元素的用途" />
											</div>
										</div>
										</div>
									</div>

									<div class="step-pane" id="element_add_steps_step2">
										<h4 class="lighter blue">第 2 步 · 内容与确认</h4>

										<div class="row">
										<div class="col-sm-12">
											<div class="form-group">
												<label for="elementContent">
													<span class="blue">元素内容</span>
												</label>

											<textarea class="autosize-transition form-control" id="elementContent" name="elementContent" placeholder="元素对应的页面片段内容（HTML）"></textarea>
											</div>
										</div>

										<div class="col-sm-12">
											<div class="form-group">
												<label for="remarks">
													<span class="blue">备注</span>
												</label>

											<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写元素相关的描述信息，留存备注"></textarea>
											</div>
										</div>
										</div>

										<div class="alert alert-warning">
											<i class="fa fa-info-circle"></i>
											undefined
										</div>

										<div class="hr hr-8 dotted"></div>

										<h5 class="lighter">
											<i class="fa fa-check-circle green"></i>
											填写摘要（提交前请核对）
										</h5>

										<div id="element_add_summary">
											<div class="text-muted">亲，请在第 1 步中填写元素信息哟！</div>
										</div>
									</div>
								</div>

								<hr />

								<div class="row-fluid wizard-actions">
									<button class="btn btn-prev" type="button">
										<i class="fa fa-arrow-left"></i>
										上一步
									</button>

									<button class="btn btn-success btn-next" type="button" data-last="新增元素 ">
										下一步
										<i class="fa fa-arrow-right icon-on-right"></i>
									</button>
								</div>
							</div>
						</div>
					</div>

					<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
						<i class="fa fa-angle-double-up icon-only bigger-110"></i>
					</a>
				</div>
			</div>
