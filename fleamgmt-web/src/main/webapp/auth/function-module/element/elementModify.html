<html>
	<head>
		<title>元素变更</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- 基础样式 basic styles -->
		<link rel="stylesheet" href="../resources/plugins/bootstrap/css/bootstrap.min.css"  />
		<link rel="stylesheet" href="../resources/plugins/font-awesome/css/font-awesome.css" />

		<!-- page specific plugin styles -->
		<link rel="stylesheet" href="../resources/plugins/jquery/ui/css/jquery-ui-1.10.3.full.min.css" />
		<link rel="stylesheet" href="../resources/plugins/dialog/6.0.4/css/ui-dialog.css" />
		<link rel="stylesheet" href="../resources/plugins/jqGrid/css/ui.jqgrid.css" />

		<!-- ace styles -->
		<link rel="stylesheet" href="../resources/plugins/ace/css/ace.css" />
		<link rel="stylesheet" href="../resources/plugins/ace/css/ace-rtl.css" />
		<link rel="stylesheet" href="../resources/plugins/ace/css/ace-skins.css" />

		<!--[if lte IE 8]>
		<link rel="stylesheet" href="../resources/plugins/ace/css/ace-ie.css"/>
		<![endif]-->

		<!-- inline styles related to this page -->
		<style>
		/* 表格内操作链接 */
		.grid-action {
			white-space: nowrap;
		}

		.ui-jqgrid {
			font-size: 13px;
		}

		/* 统计卡片 */
		.stat-card {
			padding: 10px 14px;
		}

		.stat-card .stat-value {
			font-size: 24px;
			font-weight: bold;
			line-height: 1.1;
		}

		.stat-card .stat-label {
			color: #999;
		}
		/* ==================== 窄屏适配（<768px，与 Bootstrap xs 同断点） ==================== */
		/* 表格搜索框桌面端不显示，仅小屏承担筛选职责 */
		.grid-mobile-search {
			display: none;
		}

		@media only screen and (max-width: 767px) {

			/* 兜底：组件内部（分页栏）已自带横滑，整页不应再出现横向滚动条 */
			body {
				overflow-x: hidden;
			}

			/* 顶层栅格行的负外边距在小屏会左右各顶出 3px（实测 .row 宽 381 > 视口 375），清零消除整页横滑 */
			.page-content > .row {
				margin-left: 0;
				margin-right: 0;
			}

			/* 页头：主标题收紧，面包屑与「收藏」文字收起，避免换行 */
			.page-header h1 {
				font-size: 16px;
			}

			.page-header h1 small {
				display: none;
			}

			.page-header-fav span {
				display: none;
			}

			/* 卡片头：右侧提示文字在小屏会把标题挤掉，隐藏 */
			.widget-header .widget-toolbar > small {
				display: none;
			}

			/* 统计卡：小屏三卡并排，去掉大图标，仅留数值与标签 */
			.stat-card {
				padding: 8px 4px;
				text-align: center;
			}

			.stat-card .stat-icon {
				display: none;
			}

			.stat-card .pull-right {
				float: none !important;
			}

			.stat-card .stat-value {
				font-size: 18px;
			}

			.stat-card .stat-label {
				font-size: 11px;
			}

			/* 表格搜索框：小屏出现 */
			.grid-mobile-search {
				display: block;
				margin-bottom: 6px;
			}

			/* jqGrid 筛选行：小屏控件仅 26px 宽，无法输入，整体隐藏 */
			.ui-jqgrid .ui-search-toolbar {
				display: none;
			}

			/* jqGrid 分页栏：内容天然宽于容器，改为就地横滑，避免撑破页面 */
			.ui-jqgrid .ui-jqgrid-pager {
				height: auto !important;
				overflow-x: auto;
				overflow-y: hidden;
				-webkit-overflow-scrolling: touch;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table {
				width: auto !important;
			}

			.ui-jqgrid .ui-jqgrid-pager .ui-pg-table td {
				white-space: nowrap;
			}

			/* 每页条数选择器小屏无意义，且是撑宽分页栏的主因之一 */
			.ui-jqgrid .ui-jqgrid-pager .ui-pg-selbox {
				display: none;
			}

			/* 分页栏左右两侧（刷新/每页条数、记录数）在小屏会把总宽撑到容器外，
			   收起后只留中间的分页导航，消除组件内的横向滚动条 */
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_left"],
			.ui-jqgrid .ui-jqgrid-pager td[id$="_pager_right"] {
				display: none;
			}

			/* 表格本体：字号与内边距收紧，小屏一屏多看两行 */
			.ui-jqgrid {
				font-size: 12px;
			}

			.ui-jqgrid .ui-jqgrid-htable th,
			.ui-jqgrid tr.jqgrow td {
				/* 手指点选需要更大的行高，同时兼顾一屏可见行数 */
				padding: 5px 2px;
			}

			/* 穿梭框：搜索框独占一行，列表矮一截，底部按钮整行 */
			.shuttle-toolbar .shuttle-search {
				display: block;
				width: 100%;
				margin-bottom: 6px;
			}

			.shuttle-toolbar .btn-group {
				margin-left: 0;
			}

			.shuttle-list {
				height: 190px;
			}

			/* 候选/清单条目加高，便于手指点选 */
			.shuttle-item {
				padding: 8px 4px;
			}

			.shuttle-actions .btn {
				display: block;
				width: 100%;
				margin: 0 0 6px 0;
			}

			/* 表单底部按钮：小屏留出换行间距 */
			.wizard-actions .btn {
				margin-bottom: 6px;
			}
		}

		</style>

		<script src="../resources/plugins/ace/js/ace-extra.js"></script>

		<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
		<!--[if lt IE 9]>

	<body>
		<div class="page-content">
			<div class="page-header">
				<h1>
					功能模块管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						&nbsp;元素管理
					</small>
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;元素变更
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->

			<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-4">
							<div class="widget-box widget-color-blue">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-list-alt fa-3x blue"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value blue" id="element_total">0</div>
												<div class="stat-label">元素总数</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-4">
							<div class="widget-box widget-color-green">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-check-circle fa-3x green"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value green" id="element_enabled">0</div>
												<div class="stat-label">正常</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-4">
							<div class="widget-box widget-color-red">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-ban fa-3x red"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value red" id="element_disabled">0</div>
												<div class="stat-label">停用</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="space-8"></div>
					<div class="widget-box">
						<div class="widget-header header-color-blue2">
							<h5 class="lighter smaller">
								<i class="fa fa-table fa-lg"></i>
								元素列表
							</h5>

							<span class="widget-toolbar">
								<small class="white">
									已默认选中首行，点击其它行即可切换；表头支持即时筛选
								</small>
							</span>
						</div>

						<div class="widget-body">
							<div class="widget-main padding-8">
								<table id="element_grid"></table>
								<div id="element_grid_pager"></div>
							</div>
						</div>
					</div>

					<div class="space-8"></div>

					<div class="widget-box">
						<div class="widget-header">
							<h5 class="lighter smaller">
								<i class="fa fa-refresh fa-lg"></i>
								元素变更
							</h5>

							<span class="widget-toolbar">
								<a href="#" data-action="collapse">
									<i class="fa fa-chevron-up"></i>
								</a>
							</span>
						</div>

						<div class="widget-body">
							<div id="element_change" class="widget-main" fieldset="json">
								<input type="hidden" id="elementId" name="elementId" />

								<div class="alert alert-warning" id="element_change_tip" style="display:none">
									<i class="fa fa-info-circle orange"></i>
									暂无可变更的元素数据。
								</div>

								<div class="row">
										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementCode">
													<span class="blue">元素编码</span>
												</label>

											<input class="form-control skip_over" type="text" id="elementCode" name="elementCode" placeholder="元素编码不支持变更" disabled="disabled" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementName">
													<span class="blue">元素名称</span> <span class="red">*</span>
												</label>

											<input class="form-control" type="text" id="elementName" name="elementName" placeholder="元素名称" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementType">
													<span class="blue">元素类型</span>
												</label>

											<input class="form-control" type="number" id="elementType" name="elementType" placeholder="元素类型（数值）" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="elementDesc">
													<span class="blue">元素描述</span>
												</label>

											<input class="form-control" type="text" id="elementDesc" name="elementDesc" placeholder="元素描述" />
											</div>
										</div>

										<div class="col-sm-12">
											<div class="form-group">
												<label for="elementContent">
													<span class="blue">元素内容</span>
												</label>

											<textarea class="autosize-transition form-control" id="elementContent" name="elementContent" placeholder="元素对应的页面片段内容（HTML）"></textarea>
											</div>
										</div>

										<div class="col-sm-12">
											<div class="form-group">
												<label for="remarks">
													<span class="blue">备注</span>
												</label>

											<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写元素相关的描述信息，留存备注"></textarea>
											</div>
										</div>
								</div>

								<div class="space-2"></div>

								<div class="row-fluid wizard-actions">
									<button id="submit" class="btn btn-info" type="button">
										<i class="fa fa-check bigger-110"></i>
										提交变更
									</button>
									<button id="reset" class="btn btn-inverse" type="button">
										<i class="fa fa-undo bigger-110"></i>
										重置
									</button>
								</div>
							</div>
						</div>
					</div>

					<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
						<i class="fa fa-angle-double-up icon-only bigger-110"></i>
					</a>
				</div>
			</div>
		</div>
