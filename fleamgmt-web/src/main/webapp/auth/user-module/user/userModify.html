<html>
	<head>
		<title>用户变更</title>
		<meta charset="utf-8" />

			.grid-action {
				white-space: nowrap;
			}

			/* 表格搜索框桌面端不显示，仅小屏承担筛选职责 */

				display: none;
			}

			/* 统计卡片 */
			.stat-card {
				padding: 10px 14px;
			}

			.stat-card .stat-value {
				font-size: 24px;
				font-weight: bold;
				line-height: 1.1;
			}

			.stat-card .stat-label {
				color: #999;
			}

			@media only screen and (max-width: 767px) {

				/* 表格搜索框：小屏出现 */

					display: block;
					margin-bottom: 6px;
				}

				/* 统计卡：小屏三卡并排，去掉大图标，仅留数值与标签 */
				.stat-card {
					padding: 8px 4px;
					text-align: center;
				}

				.stat-card .stat-icon {
					display: none;
				}

				.stat-card .pull-right {
					float: none !important;
				}

				.stat-card .stat-value {
					font-size: 18px;
				}

				.stat-card .stat-label {
					font-size: 11px;
				}
			}
		</style>

	<body>
		<div class="page-content">
			<div class="page-header">
				<h1>
					用户模块管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						&nbsp;用户管理
					</small>
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;用户变更
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->

			<div class="row">
				<div class="col-xs-12">
					<div class="row">
						<div class="col-xs-4">
							<div class="widget-box widget-color-blue">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-list-alt fa-3x blue"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value blue" id="user_total">0</div>
												<div class="stat-label">用户总数</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-4">
							<div class="widget-box widget-color-green">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-check-circle fa-3x green"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value green" id="user_enabled">0</div>
												<div class="stat-label">正常</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="col-xs-4">
							<div class="widget-box widget-color-red">
								<div class="widget-body">
									<div class="widget-main stat-card">
										<div class="clearfix">
											<div class="pull-left stat-icon">
												<i class="fa fa-ban fa-3x red"></i>
											</div>

											<div class="pull-right center">
												<div class="stat-value red" id="user_disabled">0</div>
												<div class="stat-label">停用</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="space-8"></div>
					<div class="widget-box">
						<div class="widget-header header-color-blue2">
							<h5 class="lighter smaller">
								<i class="fa fa-table fa-lg"></i>
								用户列表
							</h5>

							<span class="widget-toolbar">
								<small class="white">
									已默认选中首行，点击其它行即可切换；表头支持即时筛选
								</small>
							</span>
						</div>

						<div class="widget-body">
							<div class="widget-main padding-8">
								<table id="user_grid"></table>
								<div id="user_grid_pager"></div>
							</div>
						</div>
					</div>

					<div class="space-8"></div>

					<div class="widget-box">
						<div class="widget-header">
							<h5 class="lighter smaller">
								<i class="fa fa-refresh fa-lg"></i>
								用户变更
							</h5>

							<span class="widget-toolbar">
								<a href="#" data-action="collapse">
									<i class="fa fa-chevron-up"></i>
								</a>
							</span>
						</div>

						<div class="widget-body">
							<div id="user_change" class="widget-main" fieldset="json">
								<input type="hidden" id="accountId" name="accountId" />

								<div class="alert alert-warning" id="user_change_tip" style="display:none">
									<i class="fa fa-info-circle orange"></i>
									暂无可变更的用户数据。
								</div>

								<div class="row">
									<div class="col-sm-6">
										<div class="form-group">
											<label for="accountCode">
												<span class="blue">登录账号</span>
											</label>

											<input class="form-control skip_over" type="text" id="accountCode" placeholder="账号不支持变更" disabled="disabled" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="accountPwd">
												<span class="blue">新密码</span>
											</label>

											<input class="form-control" type="password" id="accountPwd" name="accountPwd" placeholder="留空表示不修改密码" autocomplete="new-password" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="userName">
												<span class="blue">用户昵称</span> <span class="red">*</span>
											</label>

											<input class="form-control" type="text" id="userName" name="userName" placeholder="用户显示名称" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="userSex">
												<span class="blue">性别</span>
											</label>

											<select class="form-control" id="userSex" name="userSex">
												<option value="1">男</option>
												<option value="2">女</option>
												<option value="3">其他</option>
											</select>
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="userEmail">
												<span class="blue">邮箱</span>
											</label>

											<input class="form-control" type="text" id="userEmail" name="userEmail" placeholder="用户邮箱" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="userPhone">
												<span class="blue">手机号</span>
											</label>

											<input class="form-control" type="text" id="userPhone" name="userPhone" placeholder="用户手机号" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="userAddress">
												<span class="blue">联系住址</span>
											</label>

											<input class="form-control" type="text" id="userAddress" name="userAddress" placeholder="用户住址" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="groupId">
												<span class="blue">所属用户组</span>
											</label>

											<select class="form-control" id="groupId" name="groupId"></select>
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="state">
												<span class="blue">账户状态</span>
											</label>

											<select class="form-control" id="state" name="state">
												<option value="1">正常</option>
												<option value="2">禁用</option>
												<option value="3">待审核</option>
											</select>
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="effectiveDate">
												<span class="blue">生效日期</span>
											</label>

											<input class="form-control" type="date" id="effectiveDate" name="effectiveDate" />
										</div>
									</div>

									<div class="col-sm-6">
										<div class="form-group">
											<label for="expiryDate">
												<span class="blue">失效日期</span>
											</label>

											<input class="form-control" type="date" id="expiryDate" name="expiryDate" />
										</div>
									</div>

									<div class="col-sm-12">
										<div class="form-group">
											<label for="remarks">
												<span class="blue">备注</span>
											</label>

											<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写用户相关的描述信息，留存备注"></textarea>
										</div>
									</div>
								</div>

								<div class="space-2"></div>

								<div class="row-fluid wizard-actions">
									<button id="submit" class="btn btn-info" type="button">
										<i class="fa fa-check bigger-110"></i>
										提交变更
									</button>
									<button id="reset" class="btn btn-inverse" type="button">
										<i class="fa fa-undo bigger-110"></i>
										重置
									</button>
								</div>
							</div>
						</div>
					</div>

					<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
						<i class="fa fa-angle-double-up icon-only bigger-110"></i>
					</a>
				</div>
			</div>
		</div>

				// ### start load authUser.js
				seajs.use(SeaJsUrlMap.get("authUser"), function(authUser) {

	</body>
