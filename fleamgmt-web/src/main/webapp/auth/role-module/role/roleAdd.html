	<body>
		<div class="page-content">
			<div class="page-header">
				<h1>
					角色模块管理
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						&nbsp;角色管理
					</small>
					<small>
						<i class="fa fa-angle-double-right fa-lg"></i>
						 &nbsp;角色新增
					</small>
				</h1>
				<!-- 收藏模块  start-->
				<div class="page-header-fav">
					<a class="page-header-fav-a" onclick="Comm.addMenuFav()">
						<i class="fa fa-star-o fa-lg"></i>
						<span>收藏</span>
					</a>
				</div>
				<!-- 收藏模块  end -->
			</div><!-- /.page-header -->

			<div class="row">
				<div class="col-xs-12">
					<div class="widget-box">
						<div class="widget-header widget-header-blue widget-header-flat">
							<h4 class="lighter">
								<i class="fa user-md fa-lg"></i>
								角色新增
							</h4>

							<div class="widget-toolbar">
								<span class="label label-info arrowed-right arrowed-in">两步完成</span>
							</div>
						</div>

						<div class="widget-body">
							<div id="auth_wizard_form" class="widget-main" fieldset="json">
								<div id="role_add_wizard" class="row-fluid" data-target="#role_add_steps">
									<ul class="wizard-steps">
										<li data-target="#role_add_steps_step1" class="active">
											<span class="step">1</span>
											<span class="title">角色信息</span>
										</li>

										<li data-target="#role_add_steps_step2">
											<span class="step">2</span>
											<span class="title">备注与确认</span>
										</li>
									</ul>
								</div>

								<hr />

								<div class="step-content row-fluid position-relative" id="role_add_steps">
									<div class="step-pane active" id="role_add_steps_step1">
										<h4 class="lighter blue">第 1 步 · 角色信息</h4>

										<div class="row">
										<div class="col-sm-6">
											<div class="form-group">
												<label for="roleName">
													<span class="blue">角色名称</span> <span class="red">*</span>
												</label>

											<input class="form-control" type="text" id="roleName" name="roleName" placeholder="如：系统管理员" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="roleDesc">
													<span class="blue">角色描述</span>
												</label>

											<input class="form-control" type="text" id="roleDesc" name="roleDesc" placeholder="简要说明该角色的职责范围" />
											</div>
										</div>

										<div class="col-sm-6">
											<div class="form-group">
												<label for="groupId">
													<span class="blue">所属角色组</span>
												</label>

											<select class="form-control" id="groupId" name="groupId"></select>

											<span class="help-block">未选择时不归属任何角色组</span>
											</div>
										</div>
										</div>
									</div>

									<div class="step-pane" id="role_add_steps_step2">
										<h4 class="lighter blue">第 2 步 · 备注与确认</h4>

										<div class="row">
										<div class="col-sm-12">
											<div class="form-group">
												<label for="remarks">
													<span class="blue">备注</span>
												</label>

											<textarea class="autosize-transition form-control" id="remarks" name="remarks" placeholder="填写角色相关的描述信息，留存备注"></textarea>
											</div>
										</div>
										</div>

										<div class="hr hr-8 dotted"></div>

										<h5 class="lighter">
											<i class="fa fa-check-circle green"></i>
											填写摘要（提交前请核对）
										</h5>

										<div id="role_add_summary">
											<div class="text-muted">亲，请在第 1 步中填写角色信息哟！</div>
										</div>
									</div>
								</div>

								<hr />

								<div class="row-fluid wizard-actions">
									<button class="btn btn-prev" type="button">
										<i class="fa fa-arrow-left"></i>
										上一步
									</button>

									<button class="btn btn-success btn-next" type="button" data-last="新增角色 ">
										下一步
										<i class="fa fa-arrow-right icon-on-right"></i>
									</button>
								</div>
							</div>
						</div>
					</div>

					<a href="#" id="btn-scroll-up" class="btn-scroll-up btn btn-sm btn-inverse">
						<i class="fa fa-angle-double-up icon-only bigger-110"></i>
					</a>
				</div>
			</div>
		</div>
