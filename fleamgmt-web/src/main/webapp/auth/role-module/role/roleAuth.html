			/* 穿梭框工具条 */
			.shuttle-toolbar {

			}

			}

			/* 候选数据列表 */
			.shuttle-list {
				height: 260px;
				overflow-y: auto;
				border: 1px solid #e5e5e5;
				border-radius: 3px;
				padding: 4px 8px;
			}

			.shuttle-item {
				display: block;

				margin: 0;
				padding: 4px 2px;

			}

			}

			.selected-list .label {

			}

			.shuttle-remove {
